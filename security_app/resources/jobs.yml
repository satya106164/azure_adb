# All jobs: serverless, run as the provisioning service principal (target run_as).
resources:
  jobs:
    cdp_security_migrate:
      name: cdp_security-migrate-${var.env_code}
      environments: &envs
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - psycopg[binary]>=3.2,<4
              - psycopg-pool>=3.2,<4
              - azure-identity>=1.17
              - requests>=2.31
              - databricks-sdk>=0.60
      tasks:
        - task_key: migrate
          environment_key: default
          spark_python_task:
            python_file: ../jobs/migrate.py
            parameters: &params
              - --bundle-root
              - ${workspace.file_path}
              - --env
              - ${var.env_code}
              - --lakebase-instance
              - ${var.lakebase_instance}
              - --pg-database
              - ${var.lakebase_database}
              - --secret-scope
              - ${var.secret_scope}
              - --dry-run
              - ${var.dry_run}
              - --graph-create-groups
              - ${var.graph_create_groups}
              - --reporting-catalog
              - ${var.catalog}
              - --reporting-schema
              - ${var.schema}
              - --security-mailbox
              - ${var.security_mailbox}
              - --admin-mailbox
              - ${var.admin_mailbox}
              - --app-url
              - ${var.app_url}
              - --drift-allowlist
              - ${var.drift_allowlist}
              - --request-app-role
              - ${var.request_app_role}
              - --admin-app-role
              - ${var.admin_app_role}
              - --auditor-role
              - ${var.lakebase_auditor_role}

    cdp_security_provisioning:
      name: cdp_security-provisioning-${var.env_code}
      max_concurrent_runs: 1
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: Europe/London
        pause_status: ${var.schedule_pause_status}
      # Add email_notifications.on_failure with your platform support mailbox
      environments: *envs
      tasks:
        - task_key: provision
          environment_key: default
          timeout_seconds: 1800
          spark_python_task:
            python_file: ../jobs/provision.py
            parameters: *params
        - task_key: notify
          depends_on: [{task_key: provision}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../jobs/notify.py
            parameters: *params

    cdp_security_daily:
      name: cdp_security-daily-${var.env_code}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: Europe/London
        pause_status: ${var.schedule_pause_status}
      # Add email_notifications.on_failure with your platform support mailbox
      environments: *envs
      tasks:
        - task_key: lifecycle
          environment_key: default
          spark_python_task:
            python_file: ../jobs/lifecycle.py
            parameters: *params
        - task_key: recertification
          depends_on: [{task_key: lifecycle}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/recertification.py
            parameters: *params
        - task_key: drift
          depends_on: [{task_key: recertification}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/drift_detection.py
            parameters: *params
        - task_key: reporting
          depends_on: [{task_key: drift}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../jobs/reporting_etl.py
            parameters: *params
        - task_key: notify
          depends_on: [{task_key: reporting}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../jobs/notify.py
            parameters: *params
