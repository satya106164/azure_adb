# All jobs: serverless, run as the jobs service principal (target run_as; in dev, the deployer).
# They read and write the Delta tables through the same SQL warehouse as the apps, and never
# change groups or grants: admins do that by hand and record it in the Catalog admin app.
resources:
  jobs:
    cdp_security_migrate:
      name: cdp_security-migrate-${var.env_code}
      environments: &envs
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - databricks-sql-connector>=3.4,<5
              - databricks-sdk>=0.60
              - azure-identity>=1.17
              - requests>=2.31
      tasks:
        - task_key: migrate
          environment_key: default
          spark_python_task:
            python_file: ../jobs/migrate.py
            parameters:
              - --bundle-root
              - ${workspace.file_path}
              - --env
              - ${var.env_code}
              - --warehouse-id
              - ${var.warehouse_id}
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              # Each app's service principal gets its own per-table grants
              - --request-app-sp
              - ${resources.apps.cdp_security_request_app.service_principal_client_id}
              - --admin-app-sp
              - ${resources.apps.cdp_security_admin_app.service_principal_client_id}

    cdp_security_notify:
      name: cdp_security-notify-${var.env_code}
      max_concurrent_runs: 1   # one sender: a notification is never sent twice
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: Europe/London
        pause_status: ${var.schedule_pause_status}
      # Add email_notifications.on_failure with your platform support mailbox
      environments: *envs
      tasks:
        - task_key: notify
          environment_key: default
          spark_python_task:
            python_file: ../jobs/notify.py
            parameters: &params
              - --bundle-root
              - ${workspace.file_path}
              - --env
              - ${var.env_code}
              - --warehouse-id
              - ${var.warehouse_id}
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --secret-scope
              - ${var.secret_scope}
              - --dry-run
              - ${var.dry_run}
              - --admin-mailbox
              - ${var.admin_mailbox}
              - --app-url
              - ${var.app_url}
              - --admin-app-url
              - ${var.admin_app_url}
              - --recert-interval-days
              - ${var.recert_interval_days}

    cdp_security_daily:
      name: cdp_security-daily-${var.env_code}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: Europe/London
        pause_status: ${var.schedule_pause_status}
      # Add email_notifications.on_failure with your platform support mailbox
      environments: *envs
      tasks:
        - task_key: lifecycle
          environment_key: default
          spark_python_task:
            python_file: ../jobs/lifecycle.py
            parameters: *params
        - task_key: recertification
          depends_on: [{task_key: lifecycle}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/recertification.py
            parameters: *params
        - task_key: reporting
          depends_on: [{task_key: recertification}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../jobs/reporting_etl.py
            parameters: *params
        - task_key: notify
          depends_on: [{task_key: reporting}]
          run_if: ALL_DONE
          environment_key: default
          spark_python_task:
            python_file: ../jobs/notify.py
            parameters: *params
