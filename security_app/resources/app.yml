# Two apps, one source folder, one Lakebase schema.
# Each app has its own service principal -> its own Postgres role -> its own grants
# (sql/lakebase/roles_template.sql), so the database itself enforces the split.
resources:
  apps:
    cdp_security_request_app:
      name: cdp-security-${var.env_code}
      description: Data access - request, approve and review access to data products and AI assets
      source_code_path: ../app
      config:
        command: ["streamlit", "run", "request_app.py"]
        env:
          - name: CDP_SECURITY_ENV
            value: ${var.env_code}
          - name: LAKEBASE_INSTANCE_NAME
            value: ${var.lakebase_instance}
          - name: CDP_SECURITY_DRY_RUN
            value: ${var.dry_run}
          - name: CDP_SECURITY_ADMIN_GROUP
            value: ${var.admin_group}
          - name: CDP_SECURITY_SECURITY_GROUP
            value: ${var.security_group}
          - name: CDP_SECURITY_AUDITOR_GROUP
            value: ${var.auditor_group}
          - name: CDP_SECURITY_BREAK_GLASS_GROUP
            value: ${var.break_glass_group}
          - name: CDP_SECURITY_SECURITY_MAILBOX
            value: ${var.security_mailbox}
          - name: CDP_SECURITY_ADMIN_MAILBOX
            value: ${var.admin_mailbox}
          - name: CDP_SECURITY_APP_URL
            value: ${var.app_url}
          - name: CDP_SECURITY_ADMIN_APP_URL
            value: ${var.admin_app_url}
          - name: CDP_SECURITY_PROVISIONING_JOB_ID
            value: ${var.provisioning_job_id}
      resources: &app_db
        - name: cdp-security-db
          database:
            instance_name: ${resources.database_instances.cdp_security_db.name}
            database_name: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
      # The on-behalf-of token is used ONLY to read the caller's own group memberships. That needs only
      # the default user-authorization scopes (iam.current-user:read, iam.access-control:read), which
      # Databricks adds itself and rejects if listed in user_api_scopes.
      permissions:
        - group_name: users
          level: CAN_USE
        - group_name: ${var.admin_group}
          level: CAN_MANAGE

    cdp_security_admin_app:
      name: cdp-security-admin-${var.env_code}
      description: Catalog admin - register data products, projects, AI assets and groups; operations; audit
      source_code_path: ../build/admin_app   # copy of ../app made by the preinit script
      config:
        command: ["streamlit", "run", "admin_app.py"]
        env:
          - name: CDP_SECURITY_ENV
            value: ${var.env_code}
          - name: LAKEBASE_INSTANCE_NAME
            value: ${var.lakebase_instance}
          - name: CDP_SECURITY_DRY_RUN
            value: ${var.dry_run}
          - name: CDP_SECURITY_ADMIN_GROUP
            value: ${var.admin_group}
          - name: CDP_SECURITY_SECURITY_GROUP
            value: ${var.security_group}
          - name: CDP_SECURITY_AUDITOR_GROUP
            value: ${var.auditor_group}
          - name: CDP_SECURITY_BREAK_GLASS_GROUP
            value: ${var.break_glass_group}
          - name: CDP_SECURITY_SECURITY_MAILBOX
            value: ${var.security_mailbox}
          - name: CDP_SECURITY_ADMIN_MAILBOX
            value: ${var.admin_mailbox}
          - name: CDP_SECURITY_APP_URL
            value: ${var.app_url}
          - name: CDP_SECURITY_ADMIN_APP_URL
            value: ${var.admin_app_url}
          - name: CDP_SECURITY_PROVISIONING_JOB_ID
            value: ${var.provisioning_job_id}
      resources: *app_db
      permissions:            # nobody else can even open it
        - group_name: ${var.admin_group}
          level: CAN_MANAGE
        - group_name: ${var.auditor_group}
          level: CAN_USE
        - group_name: ${var.security_group}
          level: CAN_USE
