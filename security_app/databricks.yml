# Databricks Asset Bundle - Security Access Workflow
# Deploy:  databricks bundle validate -t dev && databricks bundle deploy -t dev   (see docs/GUIDE.md)
bundle:
  name: cdp_security

# Two apps cannot share one source_code_path, so the admin app deploys from a copy of app/
# regenerated before every validate/deploy. Edit app/ only; build/ is never edited by hand.
experimental:
  scripts:
    preinit: rm -rf build/admin_app && mkdir -p build && rsync -a --exclude __pycache__ app/ build/admin_app/

sync:
  include:
    - build/admin_app/**   # build/ is gitignored, which would otherwise keep it out of the upload

include:
  - resources/*.yml

variables:
  catalog:
    description: EXISTING UC catalog holding the app's schema (the bundle never creates catalogs)
    default: dev_gold
  schema:
    description: UC schema for all of the app's Delta tables (created by the migrate job if missing)
    default: cdp_security
  warehouse_id:
    description: SQL warehouse that both apps and all jobs use for every read and write
  env_code:
    description: Environment code used in group names (dev | tst | prd)
    default: dev
  secret_scope:
    description: Key Vault-backed secret scope holding the Graph credentials and mail sender
    default: cdp_security
  jobs_sp:
    description: Application id of the service principal the jobs run as
  dry_run:
    description: "true = notifications are logged, not sent (the app never changes groups or grants)"
    default: "true"
  admin_group:
    default: grp-dbx-dev-app-cdp_security-admin
  admin_mailbox:
    description: Admin alerts mailbox. Must be non-empty (Apps reject empty env values)
    default: ""
  app_url:
    description: URL of the Data access (request) app - used in notifications
    default: ""
  admin_app_url:
    description: URL of the Catalog admin app
    default: ""
  schedule_pause_status:
    description: PAUSED | UNPAUSED for the notification and daily job schedules
    default: UNPAUSED
  approval_sla_hours:
    description: Business hours the data product's approvers have to decide a request
    default: "72"
  recert_interval_days:
    description: How often live access is reviewed by the data product's approvers
    default: "365"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405607693517995.15.azuredatabricks.net   # hosts the apps; deploy with OAuth U2M (databricks auth login)
    variables:
      warehouse_id: 3563e74db5969657   # Serverless Starter Warehouse
      jobs_sp: 00000000-0000-0000-0000-000000000000   # not used in dev: jobs run as the deploying OAuth user
      schedule_pause_status: PAUSED   # run jobs on demand in dev (bundle run); avoids 96 serverless runs a day
      # Apps reject env vars with an empty value; dev alerts go to the deployer (dry run: nothing is sent)
      admin_mailbox: ${workspace.current_user.userName}
      app_url: https://cdp-security-dev-7405607693517995.15.azure.databricksapps.com
      admin_app_url: https://cdp-security-admin-dev-7405607693517995.15.azure.databricksapps.com

  tst:
    mode: production
    workspace:
      host: https://adb-1111111111111111.1.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.jobs_sp}
    variables:
      env_code: tst
      # catalog: <existing tst catalog>       # set before deploying tst; the bundle never creates catalogs
      # warehouse_id: <tst SQL warehouse id>  # required
      jobs_sp: 11111111-1111-1111-1111-111111111111
      admin_group: grp-dbx-tst-app-cdp_security-admin
      dry_run: "false"

  prd:
    mode: production
    workspace:
      host: https://adb-2222222222222222.2.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.jobs_sp}
    permissions:
      - group_name: grp-dbx-prd-app-cdp_security-admin
        level: CAN_VIEW
    variables:
      env_code: prd
      # catalog: <existing prd catalog>       # set before deploying prd; the bundle never creates catalogs
      # warehouse_id: <prd SQL warehouse id>  # required
      jobs_sp: 22222222-2222-2222-2222-222222222222
      admin_group: grp-dbx-prd-app-cdp_security-admin
      dry_run: "false"
